[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdpy"
version = "0.1.0.dev0"
description = "A complete async Python framework for Telegram's TDLib"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tdpy contributors" }]
keywords = ["telegram", "tdlib", "tdjson", "async", "asyncio", "bot"]
dependencies = ["msgspec>=0.18.6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/tdpy/tdpy/tree/main/docs"
Source = "https://github.com/tdpy/tdpy"
Issues = "https://github.com/tdpy/tdpy/issues"

[project.optional-dependencies]
redis = ["redis>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tdpy"]

[tool.hatch.build.targets.sdist]
# The schema ships so the generated API can be regenerated and drift-checked
# from a source distribution alone.
include = ["src", "tests", "tools/td_api.tl", "docs", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RUF", "SIM", "PTH", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
# Int64 is an immutable int subclass, so calling it in a default is fine.
extend-immutable-calls = ["tdpy.api.base.Int64"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# FloodWait / BadRequest / Unauthorized are the names Telethon and Pyrogram use.
# Matching the ecosystem is worth more here than N818's "Error" suffix.
"src/tdpy/core/errors.py" = ["N818"]
# SkipHandler is control flow, like StopIteration. An Error suffix would
# advertise a failure where none happened.
"src/tdpy/dispatch/router.py" = ["N818"]
"src/tdpy/api/**" = ["E501", "N", "A", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
# typing_checks.py holds static assertions about the public API that only a
# type checker can verify.
files = ["src/tdpy", "tests/typing_checks.py"]

# Platform branches are unreachable on whichever platform mypy is running on;
# correctness here comes from running mypy on all three in CI, not from this flag.
[[tool.mypy.overrides]]
module = "tdpy._ffi.loader"
warn_unreachable = false

# redis is an optional extra; the storage imports it lazily and is tested
# against a duck-typed double, so its absence must not fail the type check.
[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tdpy.api.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "requires_binary: needs a real libtdjson on this machine",
    "requires_network: talks to Telegram servers",
]

[tool.coverage.run]
source = ["src/tdpy"]
# Only the generated modules are exempt; base.py and client.py are hand-written.
omit = [
    "src/tdpy/api/types.py",
    "src/tdpy/api/functions.py",
    "src/tdpy/api/methods.py",
]
